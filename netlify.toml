[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Handle serverless API calls if Netlify Functions are deployed
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Single Page Application fallback: ensure /admin, /servicos, /metodo, etc.
# resolve to /index.html and work seamlessly on direct load and page refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
